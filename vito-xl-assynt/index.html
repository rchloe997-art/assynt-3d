
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASSYNT – Mercedes Vito XL – Lit banquette</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: Arial, sans-serif;
}

#viewer {
    position: absolute;
    inset: 0;
}

#modeSelector {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: none;
    gap: 4px;
    padding: 4px;
    background: #f5f5f5;
    border: 1px solid #e5e5e5;
    border-radius: 9px;
    white-space: nowrap;
}

.modeButton {
    border: none;
    background: transparent;
    color: #555;
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 13px;
    font-family: Arial, sans-serif;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
}

.modeButton.active {
    background: #252525;
    color: white;
}

.modeButton:disabled {
    opacity: 0.5;
    cursor: wait;
}

#status {
    position: absolute;
    bottom: 75px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 12px;
    color: #777;
    text-align: center;
    width: 90%;
    pointer-events: none;
}

#indication3D {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 20;
    background: rgba(255,255,255,0.92);
    padding: 12px 16px;
    border-radius: 10px;
    color: #333333;
    font-size: 13px;
    line-height: 1.6;
    pointer-events: none;
    transition: opacity 0.3s ease;
}
</style>
</head>

<body>

<div id="indication3D">
    <div style="font-weight:600;">
        ↻ Vue 3D interactive
    </div>
    <div style="font-size:12px;color:#777777;">
        Faites glisser pour faire pivoter
    </div>
</div>

<div id="viewer"></div>

<div id="modeSelector">

    <button
        id="modeJour"
        class="modeButton active"
        type="button"
        aria-pressed="true"
    >
        Jour
    </button>

    <button
        id="modeNuit"
        class="modeButton"
        type="button"
        aria-pressed="false"
        disabled
    >
        Nuit
    </button>

</div>

<div id="status">
    Chargement du modèle 3D...
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
    "three/addons/loaders/GLTFLoader.js";

import { OrbitControls } from
    "three/addons/controls/OrbitControls.js";


// =====================================
// SCÈNE
// =====================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0xffffff);


// =====================================
// CAMÉRA
// =====================================

const camera = new THREE.PerspectiveCamera(
    35,
    window.innerWidth / window.innerHeight,
    0.01,
    10000
);


// =====================================
// RENDU
// =====================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document
    .getElementById("viewer")
    .appendChild(renderer.domElement);


// =====================================
// LUMIÈRES
// =====================================

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0xffffff,
        3
    )
);

const light = new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(5, 10, 7);

scene.add(light);


// =====================================
// CONTRÔLES
// =====================================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.06;

controls.enableZoom = true;
controls.enableRotate = true;
controls.enablePan = true;


// =====================================
// INDICATION 3D
// =====================================

const indication3D =
    document.getElementById("indication3D");

let minuterieIndication;

function masquerIndication3D() {

    clearTimeout(minuterieIndication);

    if (indication3D) {
        indication3D.style.opacity = "0";
    }
}

function afficherIndication3D() {

    clearTimeout(minuterieIndication);

    minuterieIndication = setTimeout(() => {

        if (indication3D) {
            indication3D.style.display = "block";
            indication3D.style.opacity = "1";
        }

    }, 3000);
}

controls.addEventListener(
    "start",
    masquerIndication3D
);

controls.addEventListener(
    "end",
    afficherIndication3D
);


// =====================================
// STYLE MONOCHROME
// =====================================

const drawingMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xf2f2f0,
        roughness: 0.9,
        metalness: 0,
        side: THREE.DoubleSide
    });

const edgeMaterial =
    new THREE.LineBasicMaterial({
        color: 0x303030
    });


// =====================================
// CHARGEMENT
// =====================================

const loader = new GLTFLoader();

const status =
    document.getElementById("status");

let baseModel = null;
let nightModel = null;

let selectedMode = "jour";
let selectedKitchen = "beagAdhair";


// =====================================
// CUISINES DISPONIBLES - VITO XL
// =====================================

const kitchens = {
    beagAdhair: null,
    beag: null,
    corbett: null,
    outdoor: null,
    biadh500: null
};


// =====================================
// VERSION DES FICHIERS GLB
// =====================================

const VERSION_MODELES = "20261123-xl-2";

function fichierGLB(nomFichier) {

    const url = new URL(
        nomFichier,
        window.location.href
    );

    url.searchParams.set(
        "v",
        VERSION_MODELES
    );

    return url.href;
}


// =====================================
// STYLE DESSIN
// =====================================

function applyDrawingStyle(model) {

    model.traverse(function(child) {

        if (!child.isMesh) return;

        child.material = drawingMaterial;

        const edges = new THREE.EdgesGeometry(
            child.geometry,
            25
        );

        const lines = new THREE.LineSegments(
            edges,
            edgeMaterial
        );

        child.add(lines);
    });
}


// =====================================
// CADRAGE CAMÉRA
// MODÈLE RÉDUIT À L'AFFICHAGE
// =====================================

function frameCamera(model) {

    const box =
        new THREE.Box3().setFromObject(model);

    const size = box.getSize(
        new THREE.Vector3()
    );

    const center = box.getCenter(
        new THREE.Vector3()
    );

    const maxDim = Math.max(
        size.x,
        size.y,
        size.z
    );

    if (maxDim <= 0) return;

    // Caméra reculée de 50 %
    // Anciennes valeurs : 0.9 / 0.55 / 0.9

    camera.position.set(
        center.x + maxDim * 1.35,
        center.y + maxDim * 0.825,
        center.z + maxDim * 1.35
    );

    controls.target.copy(center);

    camera.near = Math.max(
        maxDim / 100,
        0.001
    );

    camera.far = maxDim * 100;

    camera.updateProjectionMatrix();

    controls.update();
}


// =====================================
// GESTION JOUR / NUIT
// =====================================

const boutonJour =
    document.getElementById("modeJour");

const boutonNuit =
    document.getElementById("modeNuit");

function updateBedMode() {

    if (baseModel) {
        baseModel.visible =
            selectedMode === "jour";
    }

    if (nightModel) {
        nightModel.visible =
            selectedMode === "nuit";
    }

    boutonJour.classList.toggle(
        "active",
        selectedMode === "jour"
    );

    boutonNuit.classList.toggle(
        "active",
        selectedMode === "nuit"
    );

    boutonJour.setAttribute(
        "aria-pressed",
        String(selectedMode === "jour")
    );

    boutonNuit.setAttribute(
        "aria-pressed",
        String(selectedMode === "nuit")
    );
}

boutonJour.addEventListener(
    "click",
    function() {

        selectedMode = "jour";
        updateBedMode();
    }
);

boutonNuit.addEventListener(
    "click",
    function() {

        if (!nightModel) return;

        selectedMode = "nuit";
        updateBedMode();
    }
);


// =====================================
// BANQUETTE ASSYNT - MODE JOUR
// MERCEDES VITO XL
// =====================================

loader.load(
    fichierGLB("Assynt_jour.glb"),

    function(gltf) {

        baseModel = gltf.scene;

        applyDrawingStyle(baseModel);

        scene.add(baseModel);

        updateBedMode();

        frameCamera(baseModel);

        status.textContent = "";
    },

    undefined,

    function(error) {

        console.error(
            "Erreur banquette Vito XL jour :",
            error
        );

        status.textContent =
            "Erreur de chargement de la banquette.";
    }
);


// =====================================
// BANQUETTE ASSYNT - MODE NUIT
// MERCEDES VITO XL
// =====================================

loader.load(
    fichierGLB("Assynt_nuit.glb"),

    function(gltf) {

        nightModel = gltf.scene;

        applyDrawingStyle(nightModel);

        scene.add(nightModel);

        boutonNuit.disabled = false;

        updateBedMode();
    },

    undefined,

    function(error) {

        console.error(
            "Erreur banquette Vito XL nuit :",
            error
        );

        status.textContent =
            "Impossible de charger le mode nuit.";
    }
);


// =====================================
// CHARGEMENT DES CUISINES
// =====================================

function loadKitchen(key, file) {

    loader.load(
        fichierGLB(file),

        function(gltf) {

            const model = gltf.scene;

            applyDrawingStyle(model);

            kitchens[key] = model;

            model.visible = false;

            scene.add(model);

            updateKitchens();
        },

        undefined,

        function(error) {

            console.error(
                "Erreur cuisine " + key,
                error
            );

            status.textContent =
                "Impossible de charger la cuisine " + key;
        }
    );
}


// =====================================
// FICHIERS GLB - MERCEDES VITO XL
// =====================================

loadKitchen(
    "beagAdhair",
    "Beag_Adhair.glb"
);

loadKitchen(
    "beag",
    "Beag.glb"
);

loadKitchen(
    "corbett",
    "Corbett.glb"
);

loadKitchen(
    "outdoor",
    "Outdoor.glb"
);

loadKitchen(
    "biadh500",
    "Biadh.glb"
);


// =====================================
// AFFICHAGE DES CUISINES
// =====================================

function updateKitchens() {

    Object.keys(kitchens).forEach(
        function(key) {

            if (kitchens[key]) {
                kitchens[key].visible =
                    key === selectedKitchen;
            }
        }
    );
}


// =====================================
// COMMUNICATION AVEC WIX
// =====================================

window.addEventListener(
    "message",
    function(event) {

        let cuisine = event.data?.cuisine;

        // Compatibilité des identifiants Biadh

        if (cuisine === "biadh") {
            cuisine = "biadh500";
        }

        if (
            cuisine === "aucune" ||
            Object.prototype.hasOwnProperty.call(
                kitchens,
                cuisine
            )
        ) {

            selectedKitchen = cuisine;
            updateKitchens();
        }

        const mode = event.data?.mode;

        if (
            mode === "jour" ||
            (mode === "nuit" && nightModel)
        ) {

            selectedMode = mode;
            updateBedMode();
        }
    }
);


// =====================================
// ANIMATION
// =====================================

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();


// =====================================
// REDIMENSIONNEMENT
// =====================================

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
