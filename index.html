<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    font-family: Arial, sans-serif;
}

#viewer {
    position: absolute;
    inset: 0;
}

#options {
    position: absolute;
    z-index: 10;
    top: 20px;
    left: 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

button {
    background: white;
    border: 1px solid #222;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 13px;
    border-radius: 3px;
}

button:hover {
    background: #eeeeee;
}

button.active {
    background: #222;
    color: white;
}
</style>
</head>

<body>

<div id="viewer"></div>

<div id="options">
    <button class="active" data-file="Assynt_Beag_Adhair.glb">
        Beag Adhair
    </button>

    <button data-file="Assynt_Beag.glb">
        Beag
    </button>

    <button data-file="Assynt_Corbett450.glb">
        Corbett 450
    </button>

    <button data-file="Assynt_Corbett500.glb">
        Corbett 500
    </button>

    <button data-file="Assynt_Outdoor.glb">
        Outdoor
    </button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('viewer');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(
    35,
    window.innerWidth / window.innerHeight,
    0.01,
    10000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);


// LUMIERES

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0xffffff,
        3
    )
);

const light = new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(5, 10, 7);
scene.add(light);


// CONTROLES

const controls =
    new OrbitControls(camera, renderer.domElement);

controls.enableDamping = true;
controls.dampingFactor = 0.06;


// CHARGEMENT

const loader = new GLTFLoader();

let currentModel = null;
let firstLoad = true;


// MATERIAU MODE DESSIN

const drawingMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xf2f2f0,
        roughness: 0.9,
        metalness: 0
    });


function loadModel(file) {

    loader.load(file, function(gltf) {

        // Supprime l'ancien modèle

        if (currentModel) {
            scene.remove(currentModel);
        }

        const model = gltf.scene;

        currentModel = model;

        scene.add(model);


        // RENDU MONOCHROME + CONTOURS

        model.traverse(function(child) {

            if (child.isMesh) {

                child.material = drawingMaterial;

                const edges =
                    new THREE.EdgesGeometry(
                        child.geometry,
                        25
                    );

                const lines =
                    new THREE.LineSegments(
                        edges,
                        new THREE.LineBasicMaterial({
                            color: 0x303030
                        })
                    );

                child.add(lines);
            }

        });


        // CADRAGE UNIQUEMENT AU PREMIER CHARGEMENT

        if (firstLoad) {

            const box =
                new THREE.Box3().setFromObject(model);

            const size =
                box.getSize(new THREE.Vector3());

            const center =
                box.getCenter(new THREE.Vector3());

            const maxDim =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );

            camera.position.set(
                center.x + maxDim * 1.3,
                center.y + maxDim * 0.8,
                center.z + maxDim * 1.3
            );

            controls.target.copy(center);

            camera.near = maxDim / 100;
            camera.far = maxDim * 100;

            camera.updateProjectionMatrix();

            controls.update();

            firstLoad = false;
        }

    });

}


// MODELE INITIAL

loadModel("Assynt_Beag_Adhair.glb");


// BOUTONS

document
    .querySelectorAll('#options button')
    .forEach(function(button) {

        button.addEventListener(
            'click',
            function() {

                document
                    .querySelectorAll('#options button')
                    .forEach(function(b) {
                        b.classList.remove('active');
                    });

                button.classList.add('active');

                loadModel(
                    button.dataset.file
                );
            }
        );

    });


// ANIMATION

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene, camera);

}

animate();


// REDIMENSIONNEMENT

window.addEventListener(
    'resize',
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
