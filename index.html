<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurateur ASSYNT</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    font-family: Arial, sans-serif;
}

#viewer {
    position: absolute;
    inset: 0;
}

/* BOUTONS JOUR / NUIT - BAS AU CENTRE */

#modeSelector {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;

    display: none;
    gap: 4px;
    padding: 4px;

    background: #f5f5f5;
    border: 1px solid #e5e5e5;
    border-radius: 9px;

    white-space: nowrap;
}

.modeButton {
    border: none;
    background: transparent;
    color: #555;

    padding: 10px 22px;
    border-radius: 6px;

    font-size: 13px;
    font-family: Arial, sans-serif;

    cursor: pointer;
    transition: background 0.2s, color 0.2s;
}

.modeButton.active {
    background: #252525;
    color: white;
}

.modeButton:disabled {
    opacity: 0.5;
    cursor: wait;
}

#status {
    position: absolute;
    bottom: 75px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;

    font-size: 12px;
    color: #777;
    text-align: center;
    width: 90%;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="viewer"></div>

<!-- SELECTEUR JOUR / NUIT -->

<div id="modeSelector">

    <button
        id="modeJour"
        class="modeButton active"
        type="button"
        aria-pressed="true"
    >
        Jour
    </button>

    <button
        id="modeNuit"
        class="modeButton"
        type="button"
        aria-pressed="false"
        disabled
    >
        Nuit
    </button>

</div>

<div id="status">Chargement du modèle 3D...</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =====================================
// SCENE
// =====================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

// =====================================
// CAMERA
// =====================================

const camera = new THREE.PerspectiveCamera(
    35,
    window.innerWidth / window.innerHeight,
    0.01,
    10000
);

// =====================================
// RENDU
// =====================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document
    .getElementById("viewer")
    .appendChild(renderer.domElement);

// =====================================
// LUMIERES
// =====================================

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0xffffff,
        3
    )
);

const light = new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(5, 10, 7);
scene.add(light);

// =====================================
// CONTROLES
// =====================================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.06;

controls.enableZoom = true;
controls.enableRotate = true;
controls.enablePan = true;

// =====================================
// STYLE MONOCHROME
// =====================================

const drawingMaterial = new THREE.MeshStandardMaterial({
    color: 0xf2f2f0,
    roughness: 0.9,
    metalness: 0
});

const edgeMaterial = new THREE.LineBasicMaterial({
    color: 0x303030
});

// =====================================
// CHARGEMENT
// =====================================

const loader = new GLTFLoader();

const status = document.getElementById("status");

let baseModel = null;
let nightModel = null;

let selectedMode = "jour";
let selectedKitchen = "beagAdhair";

const kitchens = {
    beagAdhair: null,
    beag: null,
    corbett: null,
    outdoor: null,
    biadh500: null
};

// =====================================
// STYLE DESSIN
// =====================================

function applyDrawingStyle(model) {

    model.traverse(function(child) {

        if (!child.isMesh) return;

        child.material = drawingMaterial;

        const edges = new THREE.EdgesGeometry(
            child.geometry,
            25
        );

        const lines = new THREE.LineSegments(
            edges,
            edgeMaterial
        );

        child.add(lines);
    });
}

// =====================================
// CADRAGE CAMERA
// =====================================

function frameCamera(model) {

    const box = new THREE.Box3().setFromObject(model);

    const size = box.getSize(
        new THREE.Vector3()
    );

    const center = box.getCenter(
        new THREE.Vector3()
    );

    const maxDim = Math.max(
        size.x,
        size.y,
        size.z
    );

    if (maxDim <= 0) return;

    camera.position.set(
        center.x + maxDim * 0.9,
        center.y + maxDim * 0.55,
        center.z + maxDim * 0.9
    );

    controls.target.copy(center);

    camera.near = Math.max(
        maxDim / 100,
        0.001
    );

    camera.far = maxDim * 100;

    camera.updateProjectionMatrix();

    controls.update();
}

// =====================================
// GESTION JOUR / NUIT
// =====================================

const boutonJour =
    document.getElementById("modeJour");

const boutonNuit =
    document.getElementById("modeNuit");

function updateBedMode() {

    if (baseModel) {
        baseModel.visible =
            selectedMode === "jour";
    }

    if (nightModel) {
        nightModel.visible =
            selectedMode === "nuit";
    }

    boutonJour.classList.toggle(
        "active",
        selectedMode === "jour"
    );

    boutonNuit.classList.toggle(
        "active",
        selectedMode === "nuit"
    );

    boutonJour.setAttribute(
        "aria-pressed",
        String(selectedMode === "jour")
    );

    boutonNuit.setAttribute(
        "aria-pressed",
        String(selectedMode === "nuit")
    );
}

boutonJour.addEventListener(
    "click",
    function() {

        selectedMode = "jour";

        updateBedMode();
    }
);

boutonNuit.addEventListener(
    "click",
    function() {

        if (!nightModel) return;

        selectedMode = "nuit";

        updateBedMode();
    }
);

// =====================================
// BANQUETTE - MODE JOUR
// =====================================

loader.load(
    "Configuration%20T5.T6%20L1%20-%20Assynt.glb",

    function(gltf) {

        baseModel = gltf.scene;

        applyDrawingStyle(baseModel);

        scene.add(baseModel);

        updateBedMode();

        frameCamera(baseModel);

        status.textContent = "";
    },

    undefined,

    function(error) {

        console.error(
            "Erreur banquette jour :",
            error
        );

        status.textContent =
            "Erreur de chargement de la banquette.";
    }
);

// =====================================
// BANQUETTE - MODE NUIT
// =====================================

loader.load(
    "lit_nuit.glb",

    function(gltf) {

        nightModel = gltf.scene;

        applyDrawingStyle(nightModel);

        scene.add(nightModel);

        boutonNuit.disabled = false;

        updateBedMode();
    },

    undefined,

    function(error) {

        console.error(
            "Erreur banquette nuit :",
            error
        );

        status.textContent =
            "Impossible de charger le mode nuit.";
    }
);

// =====================================
// CHARGEMENT DES CUISINES
// =====================================

function loadKitchen(key, file) {

    loader.load(
        file,

        function(gltf) {

            const model = gltf.scene;

            applyDrawingStyle(model);

            kitchens[key] = model;

            model.visible = false;

            scene.add(model);

            updateKitchens();
        },

        undefined,

        function(error) {

            console.error(
                "Erreur cuisine " + key,
                error
            );

            status.textContent =
                "Impossible de charger la cuisine " + key;
        }
    );
}

// =====================================
// FICHIERS GLB
// =====================================

loadKitchen(
    "beagAdhair",
    "Beag%20adhair.glb"
);

loadKitchen(
    "beag",
    "Beag.glb"
);

loadKitchen(
    "corbett",
    "Corbett%20450.glb"
);

loadKitchen(
    "outdoor",
    "Outdoor.glb"
);

loadKitchen(
    "biadh500",
    "Biadh%20500.glb"
);

// =====================================
// AFFICHAGE DES CUISINES
// =====================================

function updateKitchens() {

    Object.keys(kitchens).forEach(
        function(key) {

            if (kitchens[key]) {

                kitchens[key].visible =
                    key === selectedKitchen;
            }
        }
    );
}

// =====================================
// COMMUNICATION AVEC WIX
// =====================================

window.addEventListener(
    "message",
    function(event) {

        const cuisine = event.data?.cuisine;

        if (
            cuisine === "aucune" ||
            Object.prototype.hasOwnProperty.call(
                kitchens,
                cuisine
            )
        ) {

            selectedKitchen = cuisine;

            updateKitchens();
        }

        const mode = event.data?.mode;

        if (
            mode === "jour" ||
            (mode === "nuit" && nightModel)
        ) {

            selectedMode = mode;

            updateBedMode();
        }
    }
);

// =====================================
// ANIMATION
// =====================================

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();

// =====================================
// REDIMENSIONNEMENT
// =====================================

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
