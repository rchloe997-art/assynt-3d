<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    font-family: Arial, sans-serif;
}

#viewer {
    position: absolute;
    inset: 0;
}
</style>
</head>

<body>

<div id="viewer"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('viewer');

// SCÈNE

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

// CAMÉRA

const camera = new THREE.PerspectiveCamera(
    35,
    window.innerWidth / window.innerHeight,
    0.01,
    10000
);

// RENDU

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

container.appendChild(renderer.domElement);

// LUMIÈRES

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0xffffff,
        3
    )
);

const light = new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(5, 10, 7);
scene.add(light);

// CONTRÔLES

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.06;

controls.enableZoom = true;
controls.enableRotate = true;
controls.enablePan = true;

// MATÉRIAU MONOCHROME

const drawingMaterial = new THREE.MeshStandardMaterial({
    color: 0xf2f2f0,
    roughness: 0.9,
    metalness: 0
});

const edgeMaterial = new THREE.LineBasicMaterial({
    color: 0x303030
});

// CHARGEMENT DU MODÈLE

const loader = new GLTFLoader();

function loadModel(file) {

    loader.load(
        file,

        function(gltf) {

            const model = gltf.scene;

            scene.add(model);

            // RENDU DESSIN AVEC CONTOURS

            model.traverse(function(child) {

                if (child.isMesh) {

                    child.material = drawingMaterial;

                    const edges = new THREE.EdgesGeometry(
                        child.geometry,
                        25
                    );

                    const lines = new THREE.LineSegments(
                        edges,
                        edgeMaterial
                    );

                    child.add(lines);
                }
            });

            // CENTRAGE AUTOMATIQUE

            const box = new THREE.Box3().setFromObject(model);

            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            const maxDim = Math.max(
                size.x,
                size.y,
                size.z
            );

            if (maxDim <= 0) return;

            camera.position.set(
                center.x + maxDim * 1.3,
                center.y + maxDim * 0.8,
                center.z + maxDim * 1.3
            );

            controls.target.copy(center);

            camera.near = Math.max(maxDim / 100, 0.001);
            camera.far = maxDim * 100;

            camera.updateProjectionMatrix();
            controls.update();

        },

        undefined,

        function(error) {
            console.error(
                "Erreur de chargement du modèle 3D :",
                error
            );
        }
    );
}

// MODÈLE INITIAL

loadModel(
    "Configuration%20T5.T6%20L1%20-%20Assynt.glb"
);

// ANIMATION

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene, camera);
}

animate();

// REDIMENSIONNEMENT

window.addEventListener('resize', function() {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>

</body>
</html>
