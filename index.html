<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    font-family: Arial, sans-serif;
}
#viewer {
    position: absolute;
    inset: 0;
}
#hotspot {
    position: absolute;
    z-index: 5;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid white;
    background: #252525;
    color: white;
    font-size: 22px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 9px #0003;
}
#hotspot:hover {
    background: #555;
}
#info {
    display: none;
    position: absolute;
    z-index: 10;
    top: 20px;
    right: 20px;
    width: 240px;
    max-width: calc(100% - 80px);
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 5px 25px #0002;
}
#info h3 {
    margin: 0 25px 10px 0;
    font-size: 17px;
}
#info p {
    font-size: 13px;
    line-height: 1.6;
    color: #555;
}
#close {
    position: absolute;
    top: 10px;
    right: 12px;
    background: transparent;
    border: 0;
    font-size: 23px;
    cursor: pointer;
}
</style>
</head>
<body>

<div id="viewer"></div>
<button id="hotspot" aria-label="Informations sur la banquette">+</button>

<div id="info">
    <button id="close" aria-label="Fermer">×</button>
    <h3>Lit banquette ASSYNT</h3>
    <p>
        Une banquette modulable pour profiter
        d'un espace de vie fonctionnel en journée.
    </p>
    <p>Configuration jour</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('viewer');
const hotspot = document.getElementById('hotspot');
const info = document.getElementById('info');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(
    35, window.innerWidth / window.innerHeight,
    0.01, 10000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

// LUMIÈRES
scene.add(new THREE.HemisphereLight(
    0xffffff, 0xffffff, 3
));

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(5, 10, 7);
scene.add(light);

// CONTRÔLES
const controls = new OrbitControls(
    camera, renderer.domElement
);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

// MATÉRIAUX
const drawingMaterial = new THREE.MeshStandardMaterial({
    color: 0xf2f2f0,
    roughness: 0.9,
    metalness: 0
});

const edgeMaterial = new THREE.LineBasicMaterial({
    color: 0x303030
});

// CHARGEMENT
const loader = new GLTFLoader();
const hotspotPosition = new THREE.Vector3();
const projected = new THREE.Vector3();

loader.load(
    "Configuration%20T5.T6%20L1%20-%20Assynt.glb",

    function(gltf) {
        const model = gltf.scene;
        scene.add(model);

        // RENDU MONOCHROME
        model.traverse(function(child) {
            if (child.isMesh) {
                child.material = drawingMaterial;

                const edges = new THREE.EdgesGeometry(
                    child.geometry, 25
                );

                const lines = new THREE.LineSegments(
                    edges, edgeMaterial
                );

                child.add(lines);
            }
        });

        // CADRAGE
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(
            size.x, size.y, size.z
        );

        if (maxDim <= 0) return;

        camera.position.set(
            center.x + maxDim * 1.3,
            center.y + maxDim * 0.8,
            center.z + maxDim * 1.3
        );

        controls.target.copy(center);
        camera.near = Math.max(maxDim / 100, 0.001);
        camera.far = maxDim * 100;
        camera.updateProjectionMatrix();
        controls.update();

        // POSITION INITIALE DU POINT
        // À AJUSTER APRÈS LE PREMIER TEST
        hotspotPosition.set(
            center.x - size.x * 0.20,
            center.y + size.y * 0.45,
            center.z
        );

        hotspot.style.display = 'flex';
    },

    undefined,

    function(error) {
        console.error("Erreur de chargement 3D :", error);
    }
);

// POSITION DU POINT À L'ÉCRAN
function updateHotspot() {
    if (hotspot.style.display === 'none') return;

    projected.copy(hotspotPosition).project(camera);

    const visible = projected.z >= -1 &&
                    projected.z <= 1 &&
                    Math.abs(projected.x) <= 1 &&
                    Math.abs(projected.y) <= 1;

    hotspot.style.visibility = visible ? 'visible' : 'hidden';

    if (!visible) return;

    const x = (projected.x * 0.5 + 0.5) *
              renderer.domElement.clientWidth;

    const y = (-projected.y * 0.5 + 0.5) *
              renderer.domElement.clientHeight;

    hotspot.style.left = x + 'px';
    hotspot.style.top = y + 'px';
}

// INTERACTIONS
hotspot.addEventListener('click', function() {
    info.style.display =
        info.style.display === 'block' ? 'none' : 'block';
});

document.getElementById('close').addEventListener(
    'click',
    function() {
        info.style.display = 'none';
    }
);

// ANIMATION
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    updateHotspot();
    renderer.render(scene, camera);
}
animate();

// REDIMENSIONNEMENT
window.addEventListener('resize', function() {
    camera.aspect =
        window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(
        window.innerWidth, window.innerHeight
    );
});
</script>
</body>
</html>
