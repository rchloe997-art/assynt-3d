<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurateur ASSYNT</title>
<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    font-family: Arial, sans-serif;
}

#viewer {
    position: absolute;
    inset: 0;
}

#options {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px 20px;
    min-width: 220px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

#options h3 {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 600;
}

.option {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    font-size: 13px;
    cursor: pointer;
}

.option:last-child { margin-bottom: 0; }

.option input {
    width: 17px;
    height: 17px;
    accent-color: #252525;
    cursor: pointer;
}

#status {
    position: absolute;
    bottom: 15px;
    left: 20px;
    z-index: 10;
    font-size: 12px;
    color: #777;
}
</style>
</head>
<body>

<div id="viewer"></div>

<div id="options">
    <h3>Choisissez votre cuisine</h3>

    <label class="option">
        <input type="radio" name="cuisine" value="aucune" checked>
        Aucune cuisine
    </label>

    <label class="option">
        <input type="radio" name="cuisine" value="beagAdhair">
        Cuisine Beag Adhair
    </label>

    <label class="option">
        <input type="radio" name="cuisine" value="beag">
        Cuisine Beag
    </label>

    <label class="option">
        <input type="radio" name="cuisine" value="corbett">
        Cuisine Corbett 450
    </label>

    <label class="option">
        <input type="radio" name="cuisine" value="outdoor">
        Cuisine Outdoor
    </label>
</div>

<div id="status">Chargement du modèle 3D...</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// SCENE

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

// CAMERA

const camera = new THREE.PerspectiveCamera(
    35,
    window.innerWidth / window.innerHeight,
    0.01,
    10000
);

// RENDU

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('viewer').appendChild(renderer.domElement);

// LUMIERES

scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, 3));

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(5, 10, 7);
scene.add(light);

// CONTROLES

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enableZoom = true;
controls.enableRotate = true;
controls.enablePan = true;

// STYLE MONOCHROME

const drawingMaterial = new THREE.MeshStandardMaterial({
    color: 0xf2f2f0,
    roughness: 0.9,
    metalness: 0
});

const edgeMaterial = new THREE.LineBasicMaterial({
    color: 0x303030
});

// CHARGEMENT

const loader = new GLTFLoader();
const status = document.getElementById('status');

let baseModel = null;
let selectedKitchen = "aucune";

const kitchens = {
    beagAdhair: null,
    beag: null,
    corbett: null,
    outdoor: null
};

// STYLE DESSIN

function applyDrawingStyle(model) {
    model.traverse(function(child) {
        if (!child.isMesh) return;

        child.material = drawingMaterial;

        const edges = new THREE.EdgesGeometry(
            child.geometry,
            25
        );

        const lines = new THREE.LineSegments(edges, edgeMaterial);
        child.add(lines);
    });
}

// CADRAGE CAMERA

function frameCamera(model) {
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim <= 0) return;

    camera.position.set(
        center.x + maxDim * 1.3,
        center.y + maxDim * 0.8,
        center.z + maxDim * 1.3
    );

    controls.target.copy(center);
    camera.near = Math.max(maxDim / 100, 0.001);
    camera.far = maxDim * 100;
    camera.updateProjectionMatrix();
    controls.update();
}

// BANQUETTE ASSYNT

loader.load(
    "Configuration%20T5.T6%20L1%20-%20Assynt.glb",

    function(gltf) {
        baseModel = gltf.scene;
        applyDrawingStyle(baseModel);
        scene.add(baseModel);
        frameCamera(baseModel);
        status.textContent = "";
    },

    undefined,

    function(error) {
        console.error("Erreur banquette :", error);
        status.textContent = "Erreur de chargement de la banquette.";
    }
);

// CHARGEMENT DES CUISINES

function loadKitchen(key, file) {
    loader.load(
        file,

        function(gltf) {
            const model = gltf.scene;
            applyDrawingStyle(model);

            kitchens[key] = model;
            model.visible = false;
            scene.add(model);

            updateKitchens();
        },

        undefined,

        function(error) {
            console.error("Erreur cuisine " + key, error);
            status.textContent =
                "Impossible de charger la cuisine " + key;
        }
    );
}

// FICHIERS GLB

loadKitchen("beagAdhair", "Beag%20adhair.glb");
loadKitchen("beag", "Beag.glb");
loadKitchen("corbett", "Corbett%20450.glb");
loadKitchen("outdoor", "Outdoor.glb");

// AFFICHAGE DES CUISINES

function updateKitchens() {
    Object.keys(kitchens).forEach(function(key) {
        if (kitchens[key]) {
            kitchens[key].visible = key === selectedKitchen;
        }
    });
}

// SELECTION CLIENT

document
    .querySelectorAll('input[name="cuisine"]')
    .forEach(function(input) {
        input.addEventListener('change', function() {
            if (!input.checked) return;

            selectedKitchen = input.value;
            updateKitchens();
        });
    });

// ANIMATION

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

animate();

// REDIMENSIONNEMENT

window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
